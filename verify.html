<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixoraSeal - Verify</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1220;color:#fff;padding:16px;margin:0}
.card{background:#111c33;border:1px solid #26345c;border-radius:16px;padding:16px;max-width:520px;margin:auto}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box;margin-top:10px}
button{background:#22c55e;color:#000;border:0;padding:12px;border-radius:10px;font-weight:700;width:100%;margin-top:10px}
#log{background:#000;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;margin-top:12px;min-height:60px}
.box{border-radius:10px;padding:12px;margin-top:12px;display:none;word-break:break-all}
</style></head>
<body><div class="card">
<h1>PixoraSeal - Verify</h1>
<p style="color:#aeb9d6;font-size:14px">Original hash paste karo, fir wahi photo dobara upload karo. Hash milega to Verified.</p>
<input id="origHash" placeholder="Original SHA-256 paste karo - jaise 0f11dc16...">
<input type="file" id="file" accept="image/*">
<button id="verifyBtn">Verify Photo</button>
<div id="log">Ready.</div>
<div id="result" class="box"></div>
</div>
<script>
let dataUrl="", fileName="";
document.getElementById('file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; fileName=f.name;
  const r=new FileReader(); r.onload=()=>{dataUrl=r.result; document.getElementById('log').textContent="File: "+f.name+" loaded. Verify dabao.";}; r.readAsDataURL(f);
});
document.getElementById('verifyBtn').addEventListener('click', async ()=>{
  const orig=document.getElementById('origHash').value.trim().toLowerCase();
  if(!dataUrl){ alert("Pehle photo chuno"); return; }
  document.getElementById('log').textContent="Sending to PixoraSeal server for verify...";
  try{
    const res=await fetch('/api/seal-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:fileName,image:dataUrl})});
    const data=await res.json(); if(!data.ok) throw new Error(data.error);
    const cur=data.hash.toLowerCase();
    const box=document.getElementById('result'); box.style.display='block';
    if(!orig){
      box.style.background="#1e293b"; box.innerHTML="<b>Current Seal</b><br>Claim: "+data.claim+"<br>Hash: "+cur+"<br>Issued: "+data.issuedAt;
    } else if(cur===orig){
      box.style.background="#0a2e1a"; box.style.border="1px solid #22c55e"; box.innerHTML="<b>✓ VERIFIED - Photo Original Hai</b><br>Claim: "+data.claim+"<br>Hash match ho gaya.<br>Hash: "+cur;
    } else {
      box.style.background="#3b0a0a"; box.style.border="1px solid #ef4444"; box.innerHTML="<b>✕ TAMPERED - Photo Badli Hui Hai</b><br>Original: "+orig+"<br>Ab wali: "+cur+"<br>Hash match nahi hua.";
    }
    document.getElementById('log').textContent="Server hash: "+cur;
  }catch(e){ document.getElementById('log').textContent="Error: "+e.message; }
});
</script></body></html>
